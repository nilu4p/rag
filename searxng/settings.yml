# SearXNG : métamoteur interrogé par le chat quand tes documents ne suffisent pas.
# La clé secrète vient de SEARXNG_SECRET (.env). Moteurs : ceux par défaut de SearXNG.
use_default_settings: true

general:
  instance_name: "rag-local"
  enable_metrics: false

server:
  # Instance privée sur le réseau Docker interne : pas de limiteur ni de proxy d'images
  limiter: false
  public_instance: false
  image_proxy: false
  method: "GET"

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "fr"
  formats:
    - html
    - json

outgoing:
  request_timeout: 4.0
  max_request_timeout: 8.0
