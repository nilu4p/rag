<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Assistant RAG</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f6f5e'/%3E%3Cpath d='M9 9h10l4 4v10H9z' fill='none' stroke='white' stroke-width='2'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar" id="sidebar">
    <div class="side-head">
      <button class="btn primary wide" id="newChat" type="button">＋ Nouvelle conversation</button>
    </div>
    <nav class="convs" id="convs" aria-label="Conversations"></nav>
    <div class="side-foot">
      <button class="btn ghost wide" id="openDocs" type="button">📁 Documents <span class="pill" id="docCount"></span></button>
      <div class="health" id="health" title="État des services">…</div>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn" id="toggleSide" type="button" aria-label="Menu">☰</button>
      <h1 id="title">Assistant RAG</h1>
      <button class="icon-btn" id="openDocs2" type="button" aria-label="Documents" title="Documents">📁</button>
    </header>

    <section class="chat" id="chatView">
      <div class="messages" id="messages" aria-live="polite"></div>
      <form class="composer" id="composer">
        <textarea id="input" rows="1" placeholder="Pose ta question… (/aide pour les commandes)" autocomplete="off" required></textarea>
        <div class="composer-bar">
          <select id="mode" aria-label="Mode" title="Où chercher la réponse">
            <option value="auto">🧭 Auto</option>
            <option value="docs">📄 Mes documents</option>
            <option value="web">🌐 Internet</option>
            <option value="chat">💬 Discussion</option>
          </select>
          <span class="hint" id="hint">Entrée pour envoyer · Maj+Entrée pour aller à la ligne</span>
          <button class="btn primary" id="send" type="submit">Envoyer</button>
        </div>
      </form>
    </section>

    <section class="docs hidden" id="docsView">
      <div class="docs-head">
        <h2>Mes documents</h2>
        <div class="docs-actions">
          <button class="btn" id="syncBtn" type="button" title="Indexe les fichiers nouveaux ou modifiés">⟳ Synchroniser</button>
          <button class="btn ghost" id="reindexBtn" type="button" title="Vide l'index et relit tout">Tout réindexer</button>
          <button class="btn ghost" id="closeDocs" type="button">← Retour au chat</button>
        </div>
      </div>
      <label class="drop" id="drop">
        <input type="file" id="fileInput" multiple hidden>
        <strong>Dépose tes fichiers ici</strong> ou clique pour choisir (photo possible depuis le téléphone)
        <small>PDF (même scannés), Word, OpenDocument, Excel, CSV, PowerPoint, photos (JPG, PNG, HEIC…), texte, Markdown, HTML, e-mails…</small>
      </label>
      <div class="progress hidden" id="progress"></div>
      <div class="doc-list" id="docList"></div>
    </section>
  </main>
</div>
<template id="tplMsg">
  <article class="msg">
    <div class="bubble"></div>
  </article>
</template>
<script src="/static/app.js"></script>
</body>
</html>
